server {
    listen 80;

    # Inject widget script into every HTML page
    sub_filter '</body>' '<script src="/ai-widget.js"></script></body>';
    sub_filter_once on;

    # Serve the widget JS file
    location = /ai-widget.js {
        alias /etc/nginx/widget.js;
        add_header Content-Type application/javascript;
    }

    # Proxy AI assistant
    location /api/assistant/ask {
        proxy_pass http://assistant:8000/ask;
        proxy_set_header Content-Type application/json;
    }

    # Proxy everything else to official juice-shop
    location / {
        proxy_pass http://juiceshop:3000;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
    }
}
