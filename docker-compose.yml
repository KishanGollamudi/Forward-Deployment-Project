services:

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma

  ingest:
    build: ./ai_assistant
    command: python ingest.py
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      CONFIG_PATH: /config/default.yml
    volumes:
      - ./config:/config:ro
    depends_on:
      - chromadb

  assistant:
    build: ./ai_assistant
    env_file:
      - .env
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-dummy-token}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
    depends_on:
      - chromadb
      - ingest
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  juiceshop:
    image: bkimminich/juice-shop:latest
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./widget.js:/etc/nginx/widget.js:ro
    depends_on:
      juiceshop:
        condition: service_started
      assistant:
        condition: service_healthy

volumes:
  chroma_data:
